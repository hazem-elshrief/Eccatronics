<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECCATRONICS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site">
    <!-- Desktop / laptop artwork: preserved exactly for larger screens. -->
    <img class="background desktop-background" src="background.png" alt="ECCATRONICS background">

    <a class="hotspot desktop-hotspot instagram" href="#" data-link="instagram" aria-label="Instagram"></a>
    <a class="hotspot desktop-hotspot facebook" href="#" data-link="facebook" aria-label="Facebook"></a>
    <a class="hotspot desktop-hotspot linkedin" href="#" data-link="linkedin" aria-label="LinkedIn"></a>
    <a class="hotspot desktop-hotspot tiktok" href="#" data-link="tiktok" aria-label="TikTok"></a>
    <a class="hotspot desktop-hotspot about" href="about.html" aria-label="About"></a>
    <a class="hotspot desktop-hotspot mechanical" href="#" data-link="mechanical" aria-label="Mechanical Design"></a>
    <a class="hotspot desktop-hotspot automation" href="#" data-link="automation" aria-label="Automation"></a>
    <a class="hotspot desktop-hotspot cloud" href="#" data-link="hr" aria-label="Cloud"></a>
    <a class="hotspot desktop-hotspot hr" href="#" data-link="hr" aria-label="HR"></a>
    <a class="hotspot desktop-hotspot media" href="#" data-link="social" aria-label="Media"></a>
    <a class="hotspot desktop-hotspot embedded" href="#" data-link="electronics" aria-label="Embedded System"></a>
    <a class="hotspot desktop-hotspot ai" href="#" data-link="ai" aria-label="AI"></a>
    <a class="hotspot desktop-hotspot pr" href="#" data-link="pr" aria-label="PR"></a>

    <!-- Mobile artwork: the supplied vertical design is shown as-is. -->
    <img class="mobile-background" src="mobile-background.png" alt="ECCATRONICS mobile background">

    <a class="hotspot mobile-hotspot m-instagram" href="#" data-link="instagram" aria-label="Instagram"></a>
    <a class="hotspot mobile-hotspot m-facebook" href="#" data-link="facebook" aria-label="Facebook"></a>
    <a class="hotspot mobile-hotspot m-linkedin" href="#" data-link="linkedin" aria-label="LinkedIn"></a>
    <a class="hotspot mobile-hotspot m-tiktok" href="#" data-link="tiktok" aria-label="TikTok"></a>
    <a class="hotspot mobile-hotspot m-about" href="about.html" aria-label="About"></a>
    <a class="hotspot mobile-hotspot m-mechanical" href="#" data-link="mechanical" aria-label="Mechanical Design"></a>
    <a class="hotspot mobile-hotspot m-media" href="#" data-link="social" aria-label="Media"></a>
    <a class="hotspot mobile-hotspot m-automation" href="#" data-link="automation" aria-label="Automation"></a>
    <a class="hotspot mobile-hotspot m-embedded" href="#" data-link="electronics" aria-label="Embedded System"></a>
    <a class="hotspot mobile-hotspot m-cloud" href="#" data-link="hr" aria-label="Cloud"></a>
    <a class="hotspot mobile-hotspot m-ai" href="#" data-link="ai" aria-label="AI"></a>
    <a class="hotspot mobile-hotspot m-hr" href="#" data-link="hr" aria-label="HR"></a>
    <a class="hotspot mobile-hotspot m-pr" href="#" data-link="pr" aria-label="PR"></a>
  </main>
  <script src="script.js"></script>
</body>
</html>
